# nSelf Hasura GraphQL Schema Snapshot — PLACEHOLDER (NOT the real schema)
#
# WARNING: This is a hand-written skeleton, NOT generated from a live Hasura
#          endpoint. It contains only scalars + health/placeholder root fields.
#          It produces an effectively empty typed-operation surface; consuming
#          apps get NO real compile-time GraphQL safety until it is replaced.
#
# Purpose: Lets codegen run offline/in CI without network or an admin secret.
# Replace: Run `pnpm --filter @nself/graphql-client codegen:live` with
#          HASURA_GRAPHQL_ADMIN_SECRET set against the real Hasura endpoint,
#          then commit the resulting SDL. The schema:check script
#          (scripts/check-schema.mjs) fails CI while this placeholder is in place
#          so a build cannot ship pretending the typed contract is real.
#
# SPORT: F13-CROSS-REPO-DEPS.md row @nself/graphql-client (schema snapshot)

scalar timestamptz
scalar uuid
scalar jsonb
scalar citext
scalar bigint
scalar numeric

"""
The root query type.
All nSelf queries flow through Hasura's role-based permission engine.
"""
type query_root {
  """
  Health check — returns true when Hasura is running.
  Available to all roles (anonymous included).
  """
  _health: Boolean
}

"""
The root mutation type.
All mutations require an authenticated JWT with the appropriate Hasura role.
"""
type mutation_root {
  _placeholder: Boolean
}

"""
The root subscription type.
Real-time subscriptions require an authenticated JWT with the appropriate Hasura role.
"""
type subscription_root {
  _placeholder: Boolean
}

schema {
  query: query_root
  mutation: mutation_root
  subscription: subscription_root
}
