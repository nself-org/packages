"""
The root mutation type.
All mutations require an authenticated JWT with the appropriate Hasura role.
"""
type mutation_root {
  # -- nself-ai-cc --

  insert_np_aicc_sessions(
    objects: [np_aicc_sessions_insert_input!]!
  ): np_aicc_sessions_mutation_response

  insert_np_aicc_sessions_one(
    object: np_aicc_sessions_insert_input!
  ): np_aicc_sessions

  update_np_aicc_sessions(
    _set: np_aicc_sessions_set_input
    where: np_aicc_sessions_bool_exp!
  ): np_aicc_sessions_mutation_response

  update_np_aicc_sessions_by_pk(
    _set: np_aicc_sessions_set_input
    pk_columns: np_aicc_sessions_pk_columns_input!
  ): np_aicc_sessions

  # -- nself-ai-gateway --

  insert_np_aigateway_keys(
    objects: [np_aigateway_keys_insert_input!]!
  ): np_aigateway_keys_mutation_response

  insert_np_aigateway_keys_one(
    object: np_aigateway_keys_insert_input!
  ): np_aigateway_keys

  update_np_aigateway_keys(
    _set: np_aigateway_keys_set_input
    where: np_aigateway_keys_bool_exp!
  ): np_aigateway_keys_mutation_response

  update_np_aigateway_keys_by_pk(
    _set: np_aigateway_keys_set_input
    pk_columns: np_aigateway_keys_pk_columns_input!
  ): np_aigateway_keys

  delete_np_aigateway_keys(
    where: np_aigateway_keys_bool_exp!
  ): np_aigateway_keys_mutation_response

  delete_np_aigateway_keys_by_pk(id: uuid!): np_aigateway_keys

  update_np_aigateway_quota_limits(
    _set: np_aigateway_quota_limits_set_input
    where: np_aigateway_quota_limits_bool_exp!
  ): np_aigateway_quota_limits_mutation_response

  insert_np_aigateway_request_log(
    objects: [np_aigateway_request_log_insert_input!]!
  ): np_aigateway_request_log_mutation_response

  # -- auth --

  delete_np_sessions(
    where: np_sessions_bool_exp!
  ): np_sessions_mutation_response

  delete_np_sessions_by_pk(id: uuid!): np_sessions

  # -- webhooks --

  insert_np_webhook_endpoints(
    objects: [np_webhook_endpoints_insert_input!]!
  ): np_webhook_endpoints_mutation_response

  delete_np_webhook_endpoints(
    where: np_webhook_endpoints_bool_exp!
  ): np_webhook_endpoints_mutation_response
}

