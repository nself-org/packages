  np_payment_events_aggregate(
    where: np_payment_events_bool_exp
  ): np_payment_events_aggregate!

  # -- account bridge --

  nself_accounts(
    distinct_on: [nself_accounts_select_column!]
    limit: Int
    offset: Int
    order_by: [nself_accounts_order_by!]
