    distinct_on: [np_aigateway_quota_limits_select_column!]
    limit: Int
    offset: Int
    order_by: [np_aigateway_quota_limits_order_by!]
    where: np_aigateway_quota_limits_bool_exp
  ): [np_aigateway_quota_limits!]!

  np_aigateway_request_log(
    distinct_on: [np_aigateway_request_log_select_column!]
    limit: Int
    offset: Int
    order_by: [np_aigateway_request_log_order_by!]
    where: np_aigateway_request_log_bool_exp
  ): [np_aigateway_request_log!]!

  # -- auth + user --

  np_users(
    distinct_on: [np_users_select_column!]
    limit: Int
    offset: Int
    order_by: [np_users_order_by!]
    where: np_users_bool_exp
  ): [np_users!]!

  np_users_by_pk(id: uuid!): np_users

  np_sessions(
    distinct_on: [np_sessions_select_column!]
    limit: Int
    offset: Int
    order_by: [np_sessions_order_by!]
    where: np_sessions_bool_exp
  ): [np_sessions!]!

  np_sessions_by_pk(id: uuid!): np_sessions

  # -- subscriptions + billing --

  np_subscriptions(
    distinct_on: [np_subscriptions_select_column!]
    limit: Int
    offset: Int
    order_by: [np_subscriptions_order_by!]
    where: np_subscriptions_bool_exp
  ): [np_subscriptions!]!

  np_bundle_entitlements(
    distinct_on: [np_bundle_entitlements_select_column!]
    limit: Int
