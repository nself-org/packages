    distinct_on: [np_aigateway_keys_select_column!]
    limit: Int
    offset: Int
    order_by: [np_aigateway_keys_order_by!]
    where: np_aigateway_keys_bool_exp
  ): np_aigateway_keys_aggregate!

  np_aigateway_routes(
    distinct_on: [np_aigateway_routes_select_column!]
