name: P3 Workspace CI

on:
  push:
  pull_request:

concurrency:
  group: p3-workspace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # This repo is PUBLIC, so GitHub-hosted runners are free. Keep it that way:
    # a self-hosted label here queues behind the shared runner and, per ASI
    # Policy 8, self-hosting is only for private repos that would burn minutes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        # P4-E5-W3-S05-T17: audit HIGH/CRITICAL advisories; fail on findings.
        run: pnpm audit --audit-level=high

      - name: Lint
        # Was never gated: every package carried a lint script but three of them
        # never declared eslint, so `pnpm lint` failed with "eslint: command not
        # found" and nothing noticed, because CI did not run it at all.
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test --filter "@nself/*"

      - name: License check
        run: pnpm check:licenses

      - name: Codegen check
        run: pnpm codegen:check
        env:
          HASURA_GRAPHQL_URL: ${{ secrets.HASURA_GRAPHQL_URL }}
          HASURA_GRAPHQL_ADMIN_SECRET: ${{ secrets.HASURA_GRAPHQL_ADMIN_SECRET }}
        # continue-on-error is intentionally absent — CI-CD-100%-green Hard Rule

      - name: Schema check (verify SDL is not placeholder)
        run: pnpm --filter @nself/graphql-client schema:check
        # Fails if src/codegen/schema.graphql is still the hand-written placeholder skeleton.
        # A real SDL must be committed before any release ships (E6 gate).
        # continue-on-error is intentionally absent — CI-CD-100%-green Hard Rule
