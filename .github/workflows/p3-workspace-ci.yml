name: P3 Workspace CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test --filter "@nself/*"

      - name: License check
        run: pnpm check:licenses

      - name: Codegen check
        run: pnpm codegen:check
        env:
          HASURA_GRAPHQL_URL: ${{ secrets.HASURA_GRAPHQL_URL }}
          HASURA_GRAPHQL_ADMIN_SECRET: ${{ secrets.HASURA_GRAPHQL_ADMIN_SECRET }}
        # continue-on-error is intentionally absent — CI-CD-100%-green Hard Rule
